name: Update RIME Dictionaries

on:
  schedule:
    # 每日 UTC 02:00：Wikimedia 转储（每月 1 日 / 20 日前后）与网络用语页面变化都能及时跟进
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '强制重建（忽略构建记录）'
        required: false
        type: boolean
        default: false
      variants:
        description: '只构建指定变体（逗号分隔，留空为全部）：zhwiki,zhwiktionary,zhwikisource,web-slang,moegirl'
        required: false
        type: string
        default: ''

concurrency:
  group: dict-update
  # 构建耗时可达数十分钟，取消进行中的任务只会浪费算力
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 自建词典（仅重建上游数据有变化的变体）
        id: build
        continue-on-error: true
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
          VARIANTS: ${{ inputs.variants }}
        run: |
          set -euo pipefail
          args=(--raw-dir raw --work-dir tmp/build)
          if [ "$FORCE" = "true" ]; then
            args+=(--force)
          fi
          for v in ${VARIANTS//,/ }; do
            args+=(--variant "$v")
          done
          python build_dicts.py "${args[@]}"

      - name: 统计原始产物
        id: raw
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(raw/*.dict.yaml)
          echo "count=${#files[@]}" >> "$GITHUB_OUTPUT"
          printf '构建产物：%s\n' "${files[*]:-无}"

      - name: 加工词典（带声调拼音 + 墨奇辅助码）
        if: steps.raw.outputs.count != '0'
        run: |
          set -euo pipefail
          mkdir -p output
          for f in raw/*.dict.yaml; do
            name="$(basename "$f" .dict.yaml)"
            echo "处理 $f -> output/$name.pro.dict.yaml"
            python process_dict.py "$f" "output/$name.pro.dict.yaml"
          done


      - name: 发布词典
        if: steps.raw.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ls -l output/*.pro.dict.yaml
          # 滚动发布：只覆盖本次重建的词典，未重建的变体保留上一次的可下载产物
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "最新词典" --notes "初始化"
          gh release upload latest output/*.pro.dict.yaml --clobber
          gh release edit latest \
            --title "最新词典 ($(date -u +%Y-%m-%d))" \
            --notes "自建于 $(date -u '+%Y-%m-%d %H:%M:%S UTC')；本次更新：$(ls output | tr '\n' ' ')"

      - name: 提交构建记录
        if: steps.raw.outputs.count != '0'
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions.json
          git diff --cached --quiet || git commit \
            -m "chore(dict): 📝 更新构建记录" \
            -m "Co-authored-by: Wine Fox <fox@ling.plus>"
          git push

      - name: 构建失败时标记任务失败
        if: steps.build.outcome == 'failure'
        run: |
          echo "至少一个词典变体构建失败，详见「自建词典」步骤日志" >&2
          exit 1
